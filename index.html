<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Industrial Site Inspector</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: { 850: '#0f172a', 950: '#020617' }
            }
          }
        }
      }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
        padding: 0; 
        background-color: #020617;
        color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
      }
      #root { height: 100vh; display: flex; flex-direction: column; }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
      .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); }
      
      /* Spinner for loading state */
      .loader {
        width: 48px;
        height: 48px;
        border: 5px solid #1e293b;
        border-bottom-color: #3b82f6;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }
      @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      input, select, textarea { font-size: 16px !important; } /* Prevent iOS zoom */
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "docx": "https://esm.sh/docx@9.5.1",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="dark">
    <div id="root">
        <div class="flex-1 flex flex-col items-center justify-center gap-4">
            <span class="loader"></span>
            <div class="text-[10px] font-black tracking-[0.3em] text-blue-500 uppercase">System Initializing</div>
        </div>
    </div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef, useMemo } from 'react';
      import ReactDOM from 'react-dom/client';
      import * as Lucide from 'lucide-react';
      import * as docx from 'docx';

      // --- CONSTANTS ---
      const APP_VERSION = "v2.5.0-PRO";
      const STORAGE_KEY = "SITE_INSPECTOR_DATA";
      const DEFAULT_CATEGORIES = ['Pumps', 'Motors', 'Compressors', 'Electrical Panels', 'Valves', 'Instruments'];

      // --- TYPES & UTILS ---
      const RiskLevel = { LOW: 'Low', MED: 'Med', HI: 'Hi' };
      const SiteType = { WTW: 'WTW', STW: 'STW' };

      const compressImage = (base64Str, maxWidth = 1024) => {
        return new Promise((resolve) => {
          const img = new Image();
          img.src = base64Str;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scale = maxWidth / img.width;
            if (scale < 1) {
                canvas.width = maxWidth;
                canvas.height = img.height * scale;
            } else {
                canvas.width = img.width;
                canvas.height = img.height;
            }
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        });
      };

      // --- COMPONENTS ---

      const MenuScreen = ({ onNew, onResume, hasSavedData, onSettings }) => (
        <div className="flex-1 flex flex-col p-8 justify-center max-w-md mx-auto w-full gap-8">
            <div className="text-center space-y-2">
                <div className="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-2xl shadow-blue-500/20">
                    <Lucide.ShieldCheck className="text-white w-12 h-12" />
                </div>
                <h1 className="text-3xl font-black uppercase tracking-tight">Inspector</h1>
                <p className="text-xs font-bold text-slate-500 uppercase tracking-widest">Industrial Asset Compliance</p>
            </div>

            <div className="space-y-3">
                <button onClick={onNew} className="w-full bg-blue-600 hover:bg-blue-500 text-white p-5 rounded-2xl font-black flex items-center justify-between shadow-xl transition-all active:scale-95 group">
                    <div className="flex items-center gap-4">
                        <Lucide.PlusCircle className="group-hover:rotate-90 transition-transform" />
                        <div className="text-left">
                            <div className="text-sm uppercase tracking-tight">New Inspection</div>
                            <div className="text-[10px] opacity-60 font-bold uppercase tracking-widest">Start fresh audit</div>
                        </div>
                    </div>
                    <Lucide.ChevronRight size={18} opacity={0.4} />
                </button>

                {hasSavedData && (
                    <button onClick={onResume} className="w-full bg-slate-800 hover:bg-slate-700 text-white p-5 rounded-2xl font-black flex items-center justify-between border border-slate-700 transition-all active:scale-95">
                        <div className="flex items-center gap-4">
                            <Lucide.History className="text-emerald-500" />
                            <div className="text-left">
                                <div className="text-sm uppercase tracking-tight">Resume Session</div>
                                <div className="text-[10px] opacity-60 font-bold uppercase tracking-widest text-emerald-500">Active site detected</div>
                            </div>
                        </div>
                        <Lucide.ChevronRight size={18} opacity={0.4} />
                    </button>
                )}

                <button onClick={onSettings} className="w-full bg-slate-900/50 text-slate-400 p-5 rounded-2xl font-black flex items-center justify-between border border-slate-800/50 transition-all active:scale-95">
                    <div className="flex items-center gap-4">
                        <Lucide.Settings size={20} />
                        <span className="text-xs uppercase tracking-widest">System Config</span>
                    </div>
                </button>
            </div>

            <div className="text-center mt-4">
                <span className="text-[9px] font-black text-slate-600 uppercase tracking-[0.4em]">Offline-First Enterprise Engine • {APP_VERSION}</span>
            </div>
        </div>
      );

      const SetupScreen = ({ onBack, onStart }) => {
        const [site, setSite] = useState('');
        const [user, setUser] = useState('');
        const [type, setType] = useState(SiteType.WTW);

        return (
            <div className="flex-1 flex flex-col p-6 animate-in slide-in-from-right duration-300">
                <header className="flex items-center gap-4 mb-8">
                    <button onClick={onBack} className="p-2 bg-slate-800 rounded-xl"><Lucide.ArrowLeft size={20} /></button>
                    <h2 className="font-black uppercase tracking-tight">Site Parameters</h2>
                </header>
                <div className="space-y-6 flex-1">
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Site Reference</label>
                        <input value={site} onChange={e => setSite(e.target.value)} placeholder="e.g. Crossness STW" className="w-full bg-slate-800 border border-slate-700 p-4 rounded-2xl outline-none focus:border-blue-500 transition-colors font-bold" />
                    </div>
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Inspector Name</label>
                        <input value={user} onChange={e => setUser(e.target.value)} placeholder="Full Name" className="w-full bg-slate-800 border border-slate-700 p-4 rounded-2xl outline-none focus:border-blue-500 transition-colors font-bold" />
                    </div>
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Asset Classification</label>
                        <div className="grid grid-cols-2 gap-2">
                            {Object.values(SiteType).map(t => (
                                <button key={t} onClick={() => setType(t)} className={`p-4 rounded-2xl font-black border transition-all ${type === t ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>{t}</button>
                            ))}
                        </div>
                    </div>
                </div>
                <button disabled={!site || !user} onClick={() => onStart({ site, user, type })} className="w-full bg-blue-600 text-white p-5 rounded-2xl font-black shadow-xl disabled:opacity-30 disabled:grayscale transition-all active:scale-95 mb-safe">
                    INITIALIZE AUDIT
                </button>
            </div>
        );
      };

      const Dashboard = ({ data, onPass, onDefect, onExport, onExit }) => {
        const stats = useMemo(() => {
            const passCount = Object.values(data.compliantCounts).reduce((a, b) => a + b, 0);
            const failCount = data.observations.length;
            const total = passCount + failCount;
            const issuesTotal = data.observations.reduce((a, b) => a + b.nonComplianceCount, 0);
            return {
                compliance: total === 0 ? 100 : Math.round((passCount / total) * 100),
                sis: total === 0 ? "0.000" : (issuesTotal / total).toFixed(3),
                total
            };
        }, [data]);

        return (
            <div className="flex-1 flex flex-col overflow-hidden animate-in fade-in duration-500">
                <header className="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-30">
                    <div>
                        <h2 className="font-black uppercase text-sm tracking-tight">{data.site}</h2>
                        <p className="text-[9px] font-black text-blue-500 uppercase tracking-widest">{data.type} • {data.date}</p>
                    </div>
                    <button onClick={onExit} className="p-2 text-slate-500"><Lucide.X size={20} /></button>
                </header>

                <main className="flex-1 overflow-y-auto p-4 space-y-6">
                    <div className="grid grid-cols-2 gap-3">
                        <div className="bg-slate-800/50 p-4 rounded-3xl border border-slate-700/50 text-center">
                            <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">Compliance</p>
                            <p className={`text-2xl font-black ${stats.compliance < 85 ? 'text-red-500' : 'text-emerald-500'}`}>{stats.compliance}%</p>
                        </div>
                        <div className="bg-slate-800/50 p-4 rounded-3xl border border-slate-700/50 text-center">
                            <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">SIS Score</p>
                            <p className={`text-2xl font-black ${Number(stats.sis) > 0.5 ? 'text-red-500' : 'text-blue-500'}`}>{stats.sis}</p>
                        </div>
                    </div>

                    <div className="space-y-3">
                        <h3 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] px-1">Categories</h3>
                        {DEFAULT_CATEGORIES.map(cat => (
                            <div key={cat} className="bg-slate-800 border border-slate-700 p-4 rounded-3xl flex items-center justify-between shadow-sm">
                                <div className="flex-1 min-w-0">
                                    <h4 className="font-black uppercase text-xs tracking-tight truncate">{cat}</h4>
                                    <div className="flex gap-2 mt-1">
                                        <span className="text-[9px] font-bold text-emerald-500 uppercase">{data.compliantCounts[cat] || 0} Pass</span>
                                        <span className="text-[9px] font-bold text-red-500 uppercase">{data.observations.filter(o => o.category === cat).length} Issues</span>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => onPass(cat)} className="w-12 h-12 bg-emerald-600/20 text-emerald-500 border border-emerald-600/30 rounded-2xl flex items-center justify-center active:scale-90 transition-transform"><Lucide.Check size={20} strokeWidth={3} /></button>
                                    <button onClick={() => onDefect(cat)} className="w-12 h-12 bg-red-600/20 text-red-500 border border-red-600/30 rounded-2xl flex items-center justify-center active:scale-90 transition-transform"><Lucide.AlertCircle size={20} strokeWidth={3} /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </main>

                <div className="p-4 glass border-t border-white/5 sticky bottom-0 z-40">
                    <button onClick={onExport} className="w-full bg-blue-600 text-white p-5 rounded-2xl font-black flex items-center justify-center gap-3 shadow-2xl active:scale-95 transition-all mb-safe">
                        <Lucide.FileDown size={20} /> GENERATE REPORT
                    </button>
                </div>
            </div>
        );
      };

      const DefectForm = ({ category, onBack, onSave }) => {
        const [asset, setAsset] = useState('');
        const [risk, setRisk] = useState(RiskLevel.LOW);
        const [notes, setNotes] = useState('');
        const [photos, setPhotos] = useState([]);
        const [loading, setLoading] = useState(false);
        const fileRef = useRef(null);

        const handleCapture = async (e) => {
            const files = Array.from(e.target.files);
            setLoading(true);
            for (const file of files) {
                const reader = new FileReader();
                const base64 = await new Promise(r => {
                    reader.onload = () => r(reader.result);
                    reader.readAsDataURL(file);
                });
                const optimized = await compressImage(base64);
                setPhotos(prev => [...prev, optimized]);
            }
            setLoading(false);
        };

        return (
            <div className="flex-1 flex flex-col overflow-hidden animate-in slide-in-from-bottom duration-300">
                <header className="p-4 border-b border-slate-800 flex items-center gap-4 sticky top-0 bg-slate-950 z-20">
                    <button onClick={onBack} className="p-2 bg-slate-800 rounded-xl"><Lucide.ChevronLeft size={20} /></button>
                    <div>
                        <h2 className="font-black uppercase text-xs tracking-widest text-red-500">Log Defect</h2>
                        <p className="font-black uppercase text-sm tracking-tight">{category}</p>
                    </div>
                </header>
                <main className="flex-1 overflow-y-auto p-6 space-y-6">
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Asset Name / Tag</label>
                        <input value={asset} onChange={e => setAsset(e.target.value)} placeholder="e.g. Pump 02 Gearbox" className="w-full bg-slate-800 border border-slate-700 p-4 rounded-2xl font-bold outline-none focus:border-red-500" />
                    </div>
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Risk Level</label>
                        <div className="grid grid-cols-3 gap-2">
                            {Object.values(RiskLevel).map(r => (
                                <button key={r} onClick={() => setRisk(r)} className={`p-4 rounded-2xl font-black border transition-all text-xs ${risk === r ? 'bg-red-600 border-red-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>{r}</button>
                            ))}
                        </div>
                    </div>
                    <div className="space-y-2">
                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Observations</label>
                        <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={3} placeholder="Describe the failure mode..." className="w-full bg-slate-800 border border-slate-700 p-4 rounded-2xl font-bold outline-none focus:border-red-500" />
                    </div>
                    <div className="space-y-3">
                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Photo Evidence ({photos.length})</label>
                        <div className="grid grid-cols-3 gap-2">
                            {photos.map((p, i) => (
                                <div key={i} className="aspect-square rounded-2xl border border-slate-700 overflow-hidden relative group">
                                    <img src={p} className="w-full h-full object-cover" />
                                    <button onClick={() => setPhotos(prev => prev.filter((_, idx) => idx !== i))} className="absolute top-1 right-1 bg-black/60 p-1 rounded-full"><Lucide.X size={12} /></button>
                                </div>
                            ))}
                            <button onClick={() => fileRef.current.click()} className="aspect-square rounded-2xl border-2 border-dashed border-slate-700 flex flex-col items-center justify-center gap-1 text-slate-600 active:bg-slate-800 transition-colors">
                                {loading ? <Lucide.Loader2 className="animate-spin" /> : <Lucide.Camera size={24} />}
                                <span className="text-[8px] font-black">CAPTURE</span>
                            </button>
                        </div>
                        <input ref={fileRef} type="file" accept="image/*" capture="environment" multiple className="hidden" onChange={handleCapture} />
                    </div>
                </main>
                <div className="p-4 border-t border-slate-800 glass">
                    <button disabled={!asset} onClick={() => onSave({ asset, risk, notes, photos })} className="w-full bg-red-600 text-white p-5 rounded-2xl font-black shadow-xl active:scale-95 disabled:opacity-30 mb-safe">
                        SAVE OBSERVATION
                    </button>
                </div>
            </div>
        );
      };

      // --- MAIN APP ---
      const App = () => {
        const [view, setView] = useState('MENU');
        const [activeCategory, setActiveCategory] = useState('');
        const [data, setData] = useState({
            user: '', site: '', type: '', date: '',
            compliantCounts: {}, observations: []
        });

        useEffect(() => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                // Check if we should allow resume
            }
        }, []);

        const saveToLocal = (newData) => {
            setData(newData);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(newData));
        };

        const handleStartAudit = ({ site, user, type }) => {
            const freshData = {
                site, user, type, 
                date: new Date().toLocaleDateString(),
                compliantCounts: {},
                observations: []
            };
            saveToLocal(freshData);
            setView('DASHBOARD');
        };

        const handlePass = (cat) => {
            const newData = {
                ...data,
                compliantCounts: { ...data.compliantCounts, [cat]: (data.compliantCounts[cat] || 0) + 1 }
            };
            saveToLocal(newData);
        };

        const handleSaveDefect = (defect) => {
            const newData = {
                ...data,
                observations: [...data.observations, { ...defect, category: activeCategory, id: Date.now() }]
            };
            saveToLocal(newData);
            setView('DASHBOARD');
        };

        const handleExport = async () => {
            try {
                const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, ImageRun, Table, TableRow, TableCell, WidthType } = docx;
                
                const children = [
                    new Paragraph({
                        text: `Site Audit Report: ${data.site}`,
                        heading: HeadingLevel.HEADING_1,
                        alignment: AlignmentType.CENTER,
                        spacing: { after: 400 }
                    }),
                    new Paragraph({
                        children: [
                            new TextRun({ text: `Inspector: `, bold: true }),
                            new TextRun({ text: data.user }),
                        ],
                        spacing: { after: 100 }
                    }),
                    new Paragraph({
                        children: [
                            new TextRun({ text: `Date: `, bold: true }),
                            new TextRun({ text: data.date }),
                        ],
                        spacing: { after: 400 }
                    }),
                    new Paragraph({ text: "Compliance Overview", heading: HeadingLevel.HEADING_2, spacing: { before: 200, after: 200 } }),
                    new Table({
                        width: { size: 100, type: WidthType.PERCENTAGE },
                        rows: [
                            new TableRow({ children: [
                                new TableCell({ children: [new Paragraph("Category")] }),
                                new TableCell({ children: [new Paragraph("Compliant")] }),
                                new TableCell({ children: [new Paragraph("Defects")] })
                            ]}),
                            ...DEFAULT_CATEGORIES.map(cat => new TableRow({
                                children: [
                                    new TableCell({ children: [new Paragraph(cat)] }),
                                    new TableCell({ children: [new Paragraph(String(data.compliantCounts[cat] || 0))] }),
                                    new TableCell({ children: [new Paragraph(String(data.observations.filter(o => o.category === cat).length))] })
                                ]
                            }))
                        ]
                    }),
                    new Paragraph({ text: "Detailed Findings", heading: HeadingLevel.HEADING_2, spacing: { before: 400, after: 200 } }),
                ];

                for (const obs of data.observations) {
                    children.push(new Paragraph({ text: `${obs.category} - ${obs.asset}`, heading: HeadingLevel.HEADING_3, spacing: { before: 200 } }));
                    children.push(new Paragraph({ children: [new TextRun({ text: `Risk: ${obs.risk}`, bold: true, color: obs.risk === 'Hi' ? 'FF0000' : '000000' })] }));
                    children.push(new Paragraph({ text: obs.notes, spacing: { after: 200 } }));
                }

                const doc = new Document({ sections: [{ children }] });
                const blob = await Packer.toBlob(doc);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Report_${data.site.replace(/\s+/g, '_')}.docx`;
                a.click();
            } catch (err) {
                alert("Report generation failed: " + err.message);
            }
        };

        return (
            <div className="flex-1 flex flex-col max-w-lg mx-auto w-full bg-slate-950 shadow-2xl overflow-hidden relative">
                {view === 'MENU' && <MenuScreen onNew={() => setView('SETUP')} onResume={() => setView('DASHBOARD')} hasSavedData={!!data.site} />}
                {view === 'SETUP' && <SetupScreen onBack={() => setView('MENU')} onStart={handleStartAudit} />}
                {view === 'DASHBOARD' && <Dashboard data={data} onPass={handlePass} onDefect={(cat) => { setActiveCategory(cat); setView('FORM'); }} onExport={handleExport} onExit={() => { if(confirm("Exit to main menu?")) setView('MENU') }} />}
                {view === 'FORM' && <DefectForm category={activeCategory} onBack={() => setView('DASHBOARD')} onSave={handleSaveDefect} />}
            </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
