<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Industrial Asset Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
      }
      #error-display {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        color: #ef4444;
        padding: 2rem;
        z-index: 9999;
        font-family: monospace;
        overflow-y: auto;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "docx": "https://esm.sh/docx@^9.5.1",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <div id="error-display">
      <h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem;">Application Error</h1>
      <pre id="error-content"></pre>
      <p style="margin-top: 1rem; color: #64748b; font-size: 0.875rem;">Please copy this error and send it for diagnosis.</p>
    </div>

    <script>
      // Global error logger to help debug GitHub Pages "White Screen"
      window.onerror = function(msg, url, line, col, error) {
        var display = document.getElementById('error-display');
        var content = document.getElementById('error-content');
        display.style.display = 'block';
        content.textContent = [
          'Message: ' + msg,
          'URL: ' + url,
          'Line: ' + line,
          'Column: ' + col,
          'Error object: ' + JSON.stringify(error)
        ].join('\n');
        return false;
      };
    </script>
    
    <!-- Vite entry point -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
